[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keepup-cluster"
version = "0.6.0"
description = "The replicas of this deployment, their state and the commands addressed to them."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "keepup-admin>=0.4.0",
    "keepup-db>=0.4.0",
    "keepup-auth>=0.4.0",
    "fastapi>=0.128,<1",
]

[project.entry-points."keepup.plugins"]
cluster = "keepup_cluster:ClusterPlugin"

[tool.setuptools]
packages = ["keepup_cluster"]
