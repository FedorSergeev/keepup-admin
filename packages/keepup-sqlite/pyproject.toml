[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keepup-sqlite"
version = "0.4.0"
description = "SQLite behind the abstraction, and the two things it cannot do: RETURNING and messages between replicas."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "keepup-db>=0.4.0",
]

[project.entry-points."keepup.plugins"]
sqlite = "keepup_sqlite:SqlitePlugin"

[tool.setuptools]
packages = ["keepup_sqlite"]
