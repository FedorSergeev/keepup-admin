[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keepup-modules"
version = "0.7.0"
description = "The catalogue of panel sections, and the decision about backend plugins."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "keepup-admin>=0.4.0",
    "keepup-db>=0.4.0",
    "keepup-users>=0.4.0",
    "keepup-auth>=0.4.0",
    "fastapi>=0.128,<1",
    "pydantic>=2.11,<3",
]

[project.entry-points."keepup.plugins"]
modules = "keepup_modules:ModulesPlugin"

[tool.setuptools]
packages = ["keepup_modules"]
