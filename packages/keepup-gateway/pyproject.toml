[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keepup-gateway"
version = "0.5.0"
description = "One way in for the application's services: a route table, a proxy, a balancer and the sign-in at the edge."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "keepup-admin>=0.5.0",
    "fastapi>=0.128,<1",
    # The same floor keepup-http keeps: 1.3.1 closes the advisories against the
    # 0.52 line (keepup-30).
    "starlette>=1.3.1,<2",
    "httpx>=0.28,<1",
]

[project.entry-points."keepup.plugins"]
gateway = "keepup_gateway:GatewayPlugin"

[tool.setuptools]
packages = ["keepup_gateway"]
