[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keepup-log-shipping"
version = "0.6.0"
description = "The application's own log, queued and shipped to a collector."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "keepup-admin>=0.4.0",
    "requests>=2.33",
    # requests' own transport, with the floor that excludes its advisories
    # (keepup-69); it travels with the distribution that asks for requests.
    "urllib3>=2.8",
    "httpx>=0.28",
]

[project.entry-points."keepup.plugins"]
log_shipping = "keepup_log_shipping:Log_shippingPlugin"

[tool.setuptools]
packages = ["keepup_log_shipping"]
