[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keepup-tasks"
version = "0.4.0"
description = "The one scheduler, the declared jobs and the distributed locks they run under."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "keepup-admin>=0.4.0",
    "keepup-db>=0.4.0",
    "keepup-auth>=0.4.0",
    "apscheduler>=3.10,<4",
    "fastapi>=0.128,<1",
]

[project.entry-points."keepup.plugins"]
tasks = "keepup_tasks:TasksPlugin"

[tool.setuptools]
packages = ["keepup_tasks"]
