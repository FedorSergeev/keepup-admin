[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keepup-auth"
version = "0.4.0"
description = "Sign-in, sessions, login throttling, roles, OIDC and somebody else's identity system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "keepup-db>=0.4.0",
    "keepup-users>=0.4.0",
    "bcrypt>=4.0,<5",
    "pyjwt[crypto]>=2.15,<3",
    # The authentication file is YAML, and the sign-in talks to the identity
    # provider over HTTP: both are this distribution's own (keepup-121).
    "PyYAML>=6.0,<7",
    "pydantic>=2.11,<3",
    # The sign-in answers over HTTP: its routes are FastAPI's and its middleware
    # is Starlette's, so this distribution declares both (keepup-121).
    "fastapi>=0.128,<1",
    "starlette>=1.3.1,<2",
    "httpx>=0.28",
]

[project.entry-points."keepup.plugins"]
auth = "keepup_auth:AuthPlugin"

[tool.setuptools]
# Every subpackage, spelled out: the code lives under the import name, and a
# subdirectory with an __init__.py that is not listed here never reaches an
# installation -- `keepup_auth.dto` was missing, and an installed keepup-auth
# failed to import at all.
packages = [
    "keepup_auth",
    "keepup_auth.dto",
    "keepup_auth.identity",
    "keepup_auth.providers",
]
