[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keepup-postgres"
version = "0.4.0"
description = "PostgreSQL behind the abstraction: the dialect, the connection and what the database can do."
requires-python = ">=3.11"
dependencies = [
    "keepup-db>=0.4.0",
    "psycopg2-binary>=2.9",
    "asyncpg>=0.29",
]

[project.entry-points."keepup.plugins"]
postgres = "keepup_postgres:PostgresPlugin"

[tool.setuptools]
packages = ["keepup_postgres"]
