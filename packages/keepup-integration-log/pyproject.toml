[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keepup-integration-log"
version = "0.4.0"
description = "Calls this application makes to outside systems, and the section that shows them."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "keepup-db>=0.4.0",
]

[project.entry-points."keepup.plugins"]
integration_logs = "keepup_integration_log:Integration_logsPlugin"

[tool.setuptools]
packages = ["keepup_integration_log"]
