[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keepup-http"
version = "0.5.0"
description = "The way into the application over HTTP: the application, its routes and its middleware."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "keepup-admin>=0.4.0",
    "keepup-db>=0.4.0",
    "keepup-auth>=0.4.0",
    "keepup-audit>=0.4.0",
    "keepup-cluster>=0.4.0",
    "keepup-modules>=0.4.0",
    "keepup-metrics>=0.4.0",
    "keepup-tasks>=0.4.0",
    "keepup-ui>=0.4.0",
    "fastapi>=0.128,<1",
    # 1.3.1 is where the four advisories against the 0.52 line are closed
    # (PYSEC-2026-248, -249, -2280, -2281). The old cap at <1 made a fixed
    # version uninstallable, so an installation of this package could not be
    # made safe at all -- FastAPI itself asks only for >=0.46 (keepup-30).
    "starlette>=1.3.1,<2",
    "pydantic>=2.11,<3",
]

[project.entry-points."keepup.plugins"]
http = "keepup_http:HttpPlugin"

[tool.setuptools]
packages = ["keepup_http"]

[tool.setuptools.package-data]
# The panel shell (keepup-3): the pages, the styles and the panel sections the
# framework ships. This distribution serves them, so this is where they travel
# (keepup-121, keepup-154).
keepup_http = [
    "static/*.html",
    "static/js/*.js",
    "static/css/*.css",
    "static/modules/js/*.js",
    "static/modules/css/*.css",
]
