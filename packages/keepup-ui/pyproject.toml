[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keepup-ui"
version = "0.7.0"
description = "The panel: the shell, its sections, its themes and the static files it serves."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.128,<1",
    "keepup-admin>=0.4.0",
]

[project.entry-points."keepup.plugins"]
ui = "keepup_ui:UiPlugin"

[tool.setuptools]
packages = ["keepup_ui"]
