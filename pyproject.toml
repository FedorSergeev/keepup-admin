# The framework as a package of its own.
#
# It lives inside the package directory rather than at the repository root on
# purpose: the repository root belongs to the applications, and this file has
# to travel with keepup/ when it becomes a repository of its own (keepup-8).
# Building from here -- `python -m build keepup` -- is the same operation
# before and after that move.
#
# The distribution is called keepup-admin because `keepup` on PyPI is taken by
# an unrelated package from 2015. It installs no module of its own (a script
# only), so the import name stays `keepup` and nothing collides. See
# doc/keepup.md.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keepup-admin"
version = "0.3.0"
description = "An admin framework over FastAPI: plugins, panel, users, replicas"
readme = "README.md"
requires-python = ">=3.11"
# An SPDX expression rather than a table, and no `License ::` classifier
# beside it: with license-files present the build refuses both outright
# (PEP 639).
license = "Apache-2.0"
# LICENSE is the licence verbatim; NOTICE carries the copyright and the pointer
# to the third-party notices, and clause 4(d) makes it travel with every
# derivative. THIRD-PARTY.md is package data as well, because it is served from
# beside the bundles it describes.
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY.md"]
authors = [{ name = "Fedor Sergeev", email = "fksergeev@gmail.com" }]
keywords = ["fastapi", "admin", "plugins", "framework"]
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

# What the framework itself imports, and nothing else. The repository's
# requirements.txt carries an S3 client, image handling and a tokenizer beside
# these -- they belong to the applications, and an installation of the
# framework must not drag them in.
dependencies = [
    "fastapi>=0.128,<1",
    # 1.3.1 is where the four advisories against the 0.52 line are closed
    # (PYSEC-2026-248, -249, -2280, -2281). The old cap at <1 made a fixed
    # version uninstallable, so an installation of this package could not be
    # made safe at all -- FastAPI itself asks only for >=0.46 (keepup-30).
    "starlette>=1.3.1,<2",
    "pydantic>=2.11,<3",
    "sqlalchemy>=2.0,<3",
    "apscheduler>=3.10,<4",
    # PyJWT and bcrypt are not here any more: they belong to the sign-in, which
    # declares them in its own distribution and audits them there (keepup-124).
    # The note that chose PyJWT over python-jose -- `ecdsa` carries an advisory
    # with no fixed version at all (keepup-32) -- travelled with it.
    # Floors are the first versions with no published advisory, checked by the
    # security workflow against the floors themselves, not only against what a
    # fresh install happens to resolve today (keepup-69): an installation that
    # keeps an old PyJWT satisfied the range and was open to it.
    "python-multipart>=0.0.31",
    "PyYAML>=6.0,<7",
    "psutil>=7.0",
    "prometheus-client>=0.24",
    "requests>=2.33",
    "httpx>=0.28",
    # Not imported by the framework, but pulled in by what it does import
    # (PyJWT's asymmetric algorithms, requests) with no floor of their own that
    # excludes the advisories.
    "cryptography>=50.0",
    "urllib3>=2.8",
]

[project.optional-dependencies]
# What the package's own suite needs beyond the package. Declared because
# otherwise nobody who clones the repository can run it (keepup-30).
# cryptography is no longer listed here: since keepup-32 it is a real
# dependency, brought by pyjwt[crypto].
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    # The suite runs an application on a real port with a real server in front
    # of it -- the identity-provider integration test and every profile of the
    # security audit (keepup-91, keepup-94). The distribution itself only reads
    # uvicorn's version string when somebody else serves it, which is why this
    # is the suite's need and not a dependency of the package. Without it the
    # four files that start a server fail to collect on a runner, while a
    # developer's checkout has uvicorn from elsewhere and never notices.
    "uvicorn>=0.30",
]
# The bus between replicas listens on PostgreSQL with asyncpg. Optional because
# a single-process deployment on SQLite runs the in-memory bus instead and has
# no use for it.
postgres = ["asyncpg>=0.31"]

[project.urls]
# The index draws its sidebar from these, and a reader who arrives from there
# had no way out of it but the repository. Homepage is the project page
# (docs/index.html, published by Pages from this branch); the rest are the
# places a reader asks for next. The landing page carries the same addresses,
# and tests/landing_page_tests.py holds the two to each other.
Homepage = "https://fedorsergeev.github.io/keepup-admin/"
Repository = "https://github.com/FedorSergeev/keepup-admin"
Changelog = "https://github.com/FedorSergeev/keepup-admin/blob/main/CHANGELOG.md"
Issues = "https://github.com/FedorSergeev/keepup-admin/issues"

[tool.setuptools]
# The package is this directory. Spelled out rather than discovered: from
# inside keepup/ there is no `keepup` directory to find, only its contents, so
# discovery would install `auth`, `plugins` and friends as top-level packages
# and `import keepup` would fail on an installation that looked healthy.
packages = [
    "keepup",
    "keepup.auth",
    "keepup.auth.dto",
    "keepup.auth.identity",
    "keepup.auth.providers",
    "keepup.kernel",
    "keepup.plugins",
]

[tool.setuptools.package-dir]
keepup = "."

[tool.setuptools.package-data]
# The panel shell (keepup-3) is data of the package: without it an installed
# keepup serves no panel at all.
keepup = [
    "static/*.html",
    "static/js/*.js",
    "static/css/*.css",
    # The panel sections the framework ships (keepup-4) and their
    # declaration: without them an installed package serves a panel with no
    # sections at all.
    "static/modules/js/*.js",
    "static/modules/css/*.css",
    "sections.json",
    # The framework's own plugin catalogue (keepup-101). The kernel reads it
    # without importing anything, so a clone with nothing installed still knows
    # what the framework offers.
    "plugins/builtin.json",
    # The framework's own plugins (keepup-107, keepup-108): the two drivers
    # today, each of them a file until it travels in a distribution of its own.
    "builtin/*.py",
    # The vendored bundles are minified, and minification took their licence
    # headers with it. MIT asks that the notice travel with the copy, so it
    # travels as this file.
    "THIRD-PARTY.md",
]

[tool.coverage.run]
source = ["keepup"]
# The tests live inside the package, and without this they would count as
# their own coverage: a test file that has just run is covered almost
# entirely, so the number would grow by writing tests rather than by covering
# code. The very first run reported 68% instead of the real 56 (keepup-6).
omit = [
    "*/keepup/tests/*",
    # What a local `python -m build` leaves behind: a copy of the sources that
    # no test imports, counted as uncovered and dragging the figure down by
    # sixteen points on a machine that had built a wheel (keepup-28).
    "*/build/*",
    "*/dist/*",
]

[tool.coverage.report]
# The floor lives here rather than in the workflow, so a local run and CI
# answer the same. Taken just below what the suite reaches (63%): a higher one
# would be red on the day it was written, a much lower one would say nothing.
fail_under = 60
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.pytest.ini_options]
# The package carries its own test configuration, because the repository it
# grew in does not travel with it. Without this the suite does not fail in a
# clone of the framework -- it quietly stops collecting: most of it is async,
# and pytest without an asyncio mode reports "async def functions are not
# natively supported" for every one of them. Forty-one of them, at the last
# count (keepup-26).
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# The repository's own convention: a test file is *_tests.py, which pytest's
# default pattern does not match.
python_files = ["*_tests.py", "test_*.py"]
# The directory above the package, so that `import keepup` resolves whether
# the package sits in its own repository or inside an application's.
pythonpath = ["..", "packages/keepup-db", "packages/keepup-postgres", "packages/keepup-sqlite", "packages/keepup-auth", "packages/keepup-users", "packages/keepup-ui", "packages/keepup-audit", "packages/keepup-metrics", "packages/keepup-integration-log"]
