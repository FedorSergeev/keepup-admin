# The package's own suite, on the Python versions the package claims to support.
#
# It installs the package rather than pointing pytest at the checkout, and that
# is not a formality: `import keepup` has to resolve, and in a clone the
# directory is called keepup-admin, so nothing on sys.path is named keepup until
# the package is installed.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      # One red version should not hide the others.
      fail-fast: false
      matrix:
        # requires-python says >=3.11, so every one of those is claimed.
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install the package, its capabilities and what the suite needs
        # The capabilities are distributions of their own since keepup-124
        # (packages/), and the suite imports them: with the base alone,
        # `import keepup.auth` and `keepup.db` do not resolve. The extras name
        # them for an installation from the index; in the repository they are
        # installed from the tree, together, so pip settles their mutual
        # requirements from the local packages.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" -e packages/keepup-*

      - name: Report what was actually installed
        # The dependencies are ranges, so the resolved versions are the only
        # answer to "what did this run prove". A break that follows an upstream
        # release is unreadable without them.
        run: python -m pip list

      - name: Run the suite
        run: |
          python -m pytest tests/ -q \
            --cov --cov-config=pyproject.toml \
            --cov-report=term-missing:skip-covered
