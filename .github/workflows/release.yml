# Publishing a tag to PyPI without a long-lived token.
#
# Upload is authorised by Trusted Publishing: PyPI is told once that this
# workflow, in this repository, may publish this project, and each run then
# exchanges a short-lived OIDC token for upload rights. Nothing is stored -- no
# token in a secret, none in anybody's ~/.pypirc.
#
# ONE-TIME SETUP, without which this workflow fails at the upload step:
#   pypi.org -> the project -> Settings -> Publishing -> Add a new publisher
#     Owner: FedorSergeev     Repository: keepup-admin
#     Workflow: release.yml   Environment: pypi
# The base has had one since 0.3.0. Every capability is a project of its own
# (keepup-db, keepup-auth, keepup-users, keepup-ui, keepup-audit,
# keepup-metrics, keepup-integration-log, keepup-postgres, keepup-sqlite) and
# needs the same publisher -- added as a *pending* publisher, because none of
# them exists on the index before its first release. Until those exist, cut a
# release by hand with twine instead.
#
# The tag is the trigger, and the version is not taken from it: the version is
# what the metadata declares, and the job refuses a tag any distribution
# disagrees with. A tag that says one thing while a metadata file says another
# is how a release gets published under the wrong number.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # The OIDC token PyPI checks. Nothing else is needed, and nothing else
      # should be granted.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --upgrade pip build twine

      - name: The tag and every distribution must agree
        # A tag is the release's number; `workflow_dispatch` has none, and then
        # the base's version is the one every capability is held to.
        run: |
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            python .github/scripts/release_versions.py "${GITHUB_REF_NAME#v}"
          else
            python .github/scripts/release_versions.py
          fi

      - name: Build and check every distribution
        # The base is one distribution of several since keepup-124, and the
        # release publishes the capabilities too. They are built into their own
        # directory so that they can be uploaded before the base: an
        # installation that reads the base's extras must never be pointed at a
        # project the index does not have yet.
        run: |
          python -m build --outdir dist/base
          for package in packages/*; do
            python -m build --outdir dist/capabilities "$package"
          done
          python -m twine check --strict dist/base/* dist/capabilities/*

      - name: Publish the capabilities
        # Nine projects cannot be uploaded in one atomic step, and a version
        # once uploaded cannot be replaced: a re-run after a failure has to be
        # able to finish the set, so a file that is already there is skipped.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/capabilities
          skip-existing: true

      - name: Publish the base
        # Last, and strict: by now everything the extras name is on the index,
        # and a second upload of the base's own version is a mistake worth
        # stopping for.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/base
