# Publishing a tag to PyPI without a long-lived token.
#
# Upload is authorised by Trusted Publishing: PyPI is told once that this
# workflow, in this repository, may publish this project, and each run then
# exchanges a short-lived OIDC token for upload rights. Nothing is stored -- no
# token in a secret, none in anybody's ~/.pypirc.
#
# ONE JOB PER PROJECT, and that is not a style choice. The publishing action
# mints one token per invocation, and the token is scoped to the project whose
# publisher matched: a job that uploaded two projects would get the first one
# through and then be refused for the second ("the pending publisher created the
# project successfully, but the project name supplied in the upload's metadata
# does not match it"). The action says the same thing itself: one publishing job
# per upload. The capabilities go first, in parallel, and the base waits for all
# of them -- an installation that reads the base's extras must never be pointed
# at a project the index does not have.
#
# ONE-TIME SETUP, without which the publishing job of a new project fails:
#   pypi.org -> account -> Publishing -> Add a pending publisher (one per name)
#     Owner: FedorSergeev     Repository: keepup-admin
#     Workflow: release.yml   Environment: pypi
# The base has had one since 0.3.0; each capability is a project of its own and
# needs the same, added as *pending* because it does not exist yet. A pending
# publisher does not reserve the name: the project appears at the first upload.
#
# An account-scoped API token in the `pypi` environment, named PYPI_API_TOKEN,
# is used instead when it is set -- the way out if the publishers cannot be
# registered; attestations are then off, because they need Trusted Publishing.
#
# The tag is the trigger, and the version is not taken from it: the version is
# what the metadata declares, and the job refuses a tag any distribution
# disagrees with. A tag that says one thing while a metadata file says another
# is how a release gets published under the wrong number.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capabilities:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      # The OIDC token PyPI checks. Nothing else is needed, and nothing else
      # should be granted.
      id-token: write
    strategy:
      # One project failing must not cancel the others: a missing publisher is
      # named by the job that failed, and re-running that job is the whole fix.
      fail-fast: false
      matrix:
        project:
          - keepup-audit
          - keepup-auth
          - keepup-db
          - keepup-integration-log
          - keepup-metrics
          - keepup-postgres
          - keepup-sqlite
          - keepup-tasks
          - keepup-ui
          - keepup-users

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --upgrade pip build twine

      - name: The tag and every distribution must agree
        # A tag is the release's number; `workflow_dispatch` has none, and then
        # the base's version is the one every capability is held to.
        run: |
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            python .github/scripts/release_versions.py "${GITHUB_REF_NAME#v}"
          else
            python .github/scripts/release_versions.py
          fi

      - name: Build and check ${{ matrix.project }}
        run: |
          python -m build --outdir dist "packages/${{ matrix.project }}"
          python -m twine check --strict dist/*

      - name: Publish ${{ matrix.project }}
        # `skip-existing` because the files of one project are not uploaded
        # atomically either: a release interrupted between its wheel and its
        # sdist is finished by re-running this job, not by a new version.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: ${{ secrets.PYPI_API_TOKEN == '' }}

  base:
    name: keepup-admin
    # Last, and only if every capability is up: by then everything the extras
    # name is on the index.
    needs: capabilities
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --upgrade pip build twine

      - name: The tag and every distribution must agree
        run: |
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            python .github/scripts/release_versions.py "${GITHUB_REF_NAME#v}"
          else
            python .github/scripts/release_versions.py
          fi

      - name: Build and check keepup-admin
        run: |
          python -m build --outdir dist
          python -m twine check --strict dist/*

      - name: Publish keepup-admin
        # Strict: a second upload of the base's own version is a mistake worth
        # stopping for.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: ${{ secrets.PYPI_API_TOKEN == '' }}
