# GitHub's own code scanning: what the sources say, not what they depend on.
#
# It sits beside security.yml rather than inside it because the two answer
# different questions. pip-audit asks whether a dependency has a published
# advisory; this asks whether this code has a weakness -- an injected query, a
# path built from a request, a comparison that is not constant-time. Neither
# one covers the other.
#
# Findings appear under Security -> Code scanning, not only in the run's log,
# which is why the job asks for security-events write.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: python
          # security-extended adds the checks that are accurate but noisier
          # than the default set; on a framework that hands out sessions and
          # builds SQL that is the trade worth making.
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
